<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>Home TV</title>
<link rel="stylesheet" href="css/style.css?v=1.2.1">
</head>
<body>
<div id="bg"></div>
<div id="bg-glow"></div>

<header id="top">
  <div id="clock-block">
    <div id="greeting">GOOD EVENING</div>
    <div id="clock-row">
      <div id="clock"><span id="hhmm">--:--</span><span id="ampm"></span></div>
      <div id="divider"></div>
      <div id="date-block">
        <div id="date">—</div>
        <div id="hijri"></div>
      </div>
    </div>
  </div>
</header>

<section id="prayer">
  <div id="prayer-head">
    <span id="prayer-title">WAKTU SOLAT · SENAWANG</span>
    <span id="next-prayer"></span>
  </div>
  <div id="prayer-list"></div>
</section>

<section id="featured">
  <div id="featured-name">Netflix</div>
  <div id="featured-sub"></div>
</section>

<section id="apps"></section>

<div id="screensaver">
  <div id="ss-img0" class="ss-img"></div>
  <div id="ss-img1" class="ss-img"></div>
  <div id="ss-shade"></div>
  <div id="ss-top">
    <div id="ss-clock">--:--</div>
    <div id="ss-next"></div>
  </div>
  <div id="ss-caption">
    <div id="ss-kind"></div>
    <div id="ss-title"></div>
    <div id="ss-desc"></div>
  </div>
  <div id="ss-credit">Photo &amp; text: Wikipedia</div>
</div>

<script src="js/config.js?v=1.2.1"></script>
<script src="js/screensaver.js?v=1.2.1"></script>
<script src="js/prayer.js?v=1.2.1"></script>
<script src="js/app.js?v=1.2.1"></script>
</body>
</html>
