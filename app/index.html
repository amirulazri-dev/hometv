<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>Home TV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"></div>
<div id="bg-glow"></div>

<header id="top">
  <div id="clock-block">
    <div id="greeting">GOOD EVENING</div>
    <div id="clock-row">
      <div id="clock"><span id="hhmm">--:--</span><span id="ampm"></span></div>
      <div id="divider"></div>
      <div id="date-block">
        <div id="date">—</div>
        <div id="hijri"></div>
      </div>
    </div>
  </div>
</header>

<section id="prayer">
  <div id="prayer-head">
    <span id="prayer-title">WAKTU SOLAT · SENAWANG</span>
    <span id="next-prayer"></span>
  </div>
  <div id="prayer-list"></div>
</section>

<section id="featured">
  <div id="featured-name">Netflix</div>
  <div id="featured-sub"></div>
</section>

<section id="apps"></section>

<script src="js/config.js"></script>
<script src="js/prayer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
