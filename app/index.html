<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>Home TV</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden;
               background: #12060c; color: #fff; font-family: "SamsungOne", Arial, sans-serif; }
  #boot { position: absolute; top: 500px; left: 0; right: 0; text-align: center; font-size: 32px; opacity: 0.6; }
</style>
</head>
<body>
<div id="boot">Loading Home TV…</div>
<script>
/*
 * Home TV loader. This small file stays the same forever.
 * It loads the real home screen (main.html + css + js) fresh from GitHub Pages,
 * so changes you commit on GitHub reach the TV within a few minutes.
 * If GitHub Pages can't be reached, it falls back to the copy bundled with the module.
 */
(function () {
  var SOURCES = [
    "https://amirulazri-dev.github.io/hometv/app/",   // live site (GitHub Pages)
    ""                                               // bundled copy (same folder)
  ];
  var stamp = Date.now();

  function get(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout = 10000;
    x.onload = function () { (x.status >= 200 && x.status < 300) ? ok(x.responseText) : fail(); };
    x.onerror = x.ontimeout = fail;
    x.send();
  }

  function full(base, url) {
    var u = /^https?:/.test(url) ? url : base + url;
    return u + (u.indexOf("?") === -1 ? "?" : "&") + "t=" + stamp;
  }

  function tryFrom(i) {
    if (i >= SOURCES.length) {
      document.getElementById("boot").textContent = "Could not load Home TV. Check the internet connection.";
      return;
    }
    var base = SOURCES[i];
    get(full(base, "main.html"), function (html) { start(base, html); }, function () { tryFrom(i + 1); });
  }

  function start(base, html) {
    var doc = new DOMParser().parseFromString(html, "text/html");

    var links = doc.querySelectorAll('link[rel="stylesheet"]');
    for (var i = 0; i < links.length; i++) {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = full(base, links[i].getAttribute("href"));
      document.head.appendChild(l);
    }

    var srcs = [], scripts = doc.body.querySelectorAll("script[src]");
    for (var j = 0; j < scripts.length; j++) {
      srcs.push(scripts[j].getAttribute("src"));
      scripts[j].parentNode.removeChild(scripts[j]);
    }
    document.body.innerHTML = doc.body.innerHTML;

    (function next(k) {
      if (k >= srcs.length) return;
      var s = document.createElement("script");
      s.src = full(base, srcs[k]);
      s.onload = s.onerror = function () { next(k + 1); };
      document.body.appendChild(s);
    })(0);
  }

  tryFrom(0);
})();
</script>
</body>
</html>
